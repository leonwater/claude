# 자료 퀴즈 앱(study-quiz-app)을 안드로이드 APK로 빌드해 GitHub 릴리스에 올린다.
# 휴대폰에서 저장소의 Releases → 최신 릴리스 → .apk 파일을 받아 설치하면 된다.
name: Android APK

on:
  push:
    branches: [main, claude/nifty-thompson-qgmquq]
    paths:
      - "study-quiz-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: study-quiz-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-quiz-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app and sync into Android project
        run: npm run build:android

      - name: Build signed APK
        working-directory: study-quiz-app/android
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "studyquiz-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: studyquiz-apk
          path: study-quiz-app/studyquiz-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-1.0.${{ github.run_number }}" studyquiz-*.apk \
            --target "${{ github.sha }}" \
            --title "자료퀴즈 1.0.${{ github.run_number }}" \
            --notes "휴대폰에서 아래 .apk 파일을 눌러 내려받아 설치하세요. 이전 버전 위에 덮어 설치해도 자료는 유지됩니다." \
            --latest
